<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moldura Karina Paiva 1022</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Moldura Oficial - Karina Paiva 1022</h2>
    <p>Escolha sua foto, ajuste no círculo e baixe para o seu perfil!</p>

    <div class="upload-box">
      <label for="upload" class="upload-btn">📷 Selecionar Minha Foto</label>
      <input type="file" id="upload" accept="image/*">
    </div>

    <div class="canvas-wrapper">
      <canvas id="previewCanvas" width="1080" height="1080"></canvas>
    </div>

    <div class="controls">
      <label for="zoomRange">Zoom / Ajuste de Tamanho:</label>
      <input type="range" id="zoomRange" min="0.5" max="2.5" step="0.01" value="1" disabled>
    </div>

    <button id="downloadBtn" class="download-btn" disabled>⬇️ Baixar Foto com Moldura</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
